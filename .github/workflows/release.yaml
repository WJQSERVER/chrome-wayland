name: Build deb package and create GitHub Release

on:
  push:
    tags:
      - '1.0.1-1'
      - 'v*'
      - '*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build deb and create Release
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential devscripts debhelper

    - name: Build deb package
      run: |
        cd chrome-wayland
        debuild -us -uc -b

    - name: Find deb package file
      id: get_filename
      run: |
        FILE_NAME=$(find .. -maxdepth 1 -name "*.deb" -exec basename {} \; | head -n 1)
        echo "DEB_FILE_NAME=$FILE_NAME" >> $GITHUB_OUTPUT
        echo "DEB_FILE_PATH=../$FILE_NAME" >> $GITHUB_OUTPUT

    - name: Create GitHub Release
      id: create_release
      uses: softprops/action-gh-release@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref_name }}
        release_name: ${{ github.ref_name }}
        draft: false
        prerelease: false
        generate_release_notes: true

    - name: Upload deb package to Release
      uses: softprops/action-gh-release@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        files: ${{ steps.get_filename.outputs.DEB_FILE_PATH }}
        tag_name: ${{ github.ref_name }}
